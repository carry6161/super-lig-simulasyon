                { ev: "Amed Sportif Faaliyetler", dep: "Göztepe", evSkor: "", depSkor: "" },
                { ev: "Galatasaray", dep: "Alanyaspor", evSkor: "", depSkor: "" },
                { ev: "Trabzonspor", dep: "Kocaelispor", evSkor: "", depSkor: "" }
            ];

            // 17. Hafta
            hedefFikstur[17] = [
                { ev: "Fenerbahçe", dep: "Amed Sportif Faaliyetler", evSkor: "", depSkor: "" },
                { ev: "Kocaelispor", dep: "Kasımpaşa", evSkor: "", depSkor: "" },
                { ev: "Alanyaspor", dep: "İstanbul Başakşehir", evSkor: "", depSkor: "" },
                { ev: "Çaykur Rizespor", dep: "Gençlerbirliği", evSkor: "", depSkor: "" },
                { ev: "Gaziantep FK", dep: "Galatasaray", evSkor: "", depSkor: "" },
                { ev: "Çorum FK", dep: "Konyaspor", evSkor: "", depSkor: "" },
                { ev: "Göztepe", dep: "Beşiktaş", evSkor: "", depSkor: "" },
                { ev: "Erzurumspor FK", dep: "Trabzonspor", evSkor: "", depSkor: "" },
                { ev: "Eyüpspor", dep: "Samsunspor", evSkor: "", depSkor: "" }
            ];

            // 2. Devre Fikstürü (Rövanşlar - 18 ile 34. Hafta arası)
            for (let hafta = 1; hafta <= totalHafta; hafta++) {
                let ikinciDevreHafta = hafta + totalHafta;
                let birinciDevreMaclari = hedefFikstur[hafta];
                let yeniHaftaMaclari = [];

                birinciDevreMaclari.forEach(mac => {
                    yeniHaftaMaclari.push({ ev: mac.dep, dep: mac.ev, evSkor: "", depSkor: "" });
                });
                hedefFikstur[ikinciDevreHafta] = yeniHaftaMaclari;
            }
        }

        function arayuzuBaslat() {
            verileriYukle();
            let gSecici = document.getElementById("gercekHaftaSecici");
            let tSecici = document.getElementById("tahminHaftaSecici");
            gSecici.innerHTML = "";
            tSecici.innerHTML = "";
            for (let h = 1; h <= 34; h++) {
                gSecici.innerHTML += `<option value="${h}">${h}. Hafta</option>`;
                tSecici.innerHTML += `<option value="${h}">${h}. Hafta</option>`;
            }
            gercekHaftaDegisti();
            tahminHaftaDegisti();
            gercekPuanlariHesapla();
            yarismaPuanlariniHesapla();
        }

        function gercekHaftaDegisti() {
            let h = document.getElementById("gercekHaftaSecici").value;
            let alan = document.getElementById("gercekMaclarAlani");
            alan.innerHTML = "";
            if(!gercekFikstur[h]) return;
            gercekFikstur[h].forEach((mac, index) => {
                alan.innerHTML += `
                    <div class="match-row">
                        <div class="team-box left">
                            <span>${mac.ev}</span>
                            <img src="${logoGetir(mac.ev)}" class="team-logo" alt="">
                        </div>
                        <div>
                            <input type="number" id="g_h${h}_m${index}_ev" value="${mac.evSkor}" oninput="gercekSkorKaydet(${h}, ${index})"> - 
                            <input type="number" id="g_h${h}_m${index}_dep" value="${mac.depSkor}" oninput="gercekSkorKaydet(${h}, ${index})">
                        </div>
                        <div class="team-box right">
                            <img src="${logoGetir(mac.dep)}" class="team-logo" alt="">
                            <span>${mac.dep}</span>
                        </div>
                    </div>`;
            });
        }

        function gercekSkorKaydet(h, i) {
            gercekFikstur[h][i].evSkor = document.getElementById(`g_h${h}_m${i}_ev`).value;
            gercekFikstur[h][i].depSkor = document.getElementById(`g_h${h}_m${i}_dep`).value;
            verileriKaydet();
        }

        function profilDegisti() {
            let pIndex = document.getElementById("profilSecici").value;
            document.getElementById("aktifProfilAdi").innerText = `${oyuncuIsimleri[pIndex]} Tahminleri`;
            tahminHaftaDegisti();
        }

        function tahminHaftaDegisti() {
            let p = document.getElementById("profilSecici").value;
            let h = document.getElementById("tahminHaftaSecici").value;
            let alan = document.getElementById("tahminMaclarAlani");
            alan.innerHTML = "";
            if(!oyuncuTahminleri[p][h]) return;
            oyuncuTahminleri[p][h].forEach((mac, i) => {
                alan.innerHTML += `
                    <div class="match-row">
                        <div class="team-box left">
                            <span>${mac.ev}</span>
                            <img src="${logoGetir(mac.ev)}" class="team-logo" alt="">
                        </div>
                        <div>
                            <input type="number" id="t_p${p}_h${h}_m${i}_ev" value="${mac.evSkor}" oninput="tahminSkorKaydet(${p}, ${h}, ${i})"> - 
                            <input type="number" id="t_p${p}_h${h}_m${i}_dep" value="${mac.depSkor}" oninput="tahminSkorKaydet(${p}, ${h}, ${i})">
                        </div>
                        <div class="team-box right">
                            <img src="${logoGetir(mac.dep)}" class="team-logo" alt="">
                            <span>${mac.dep}</span>
                        </div>
                    </div>`;
            });
        }

        function tahminSkorKaydet(p, h, i) {
            oyuncuTahminleri[p][h][i].evSkor = document.getElementById(`t_p${p}_h${h}_m${i}_ev`).value;
            oyuncuTahminleri[p][h][i].depSkor = document.getElementById(`t_p${p}_h${h}_m${i}_dep`).value;
            verileriKaydet();
        }

        function tahminleriKaydetMesaji() { verileriKaydet(); alert("Kaydedildi!"); }

        function gercekPuanlariHesapla() {
            let pd = {};
            takimListesi.forEach(t => pd[t] = {o:0, g:0, b:0, m:0, a:0, y:0, p:0});
            for(let h=1; h<=34; h++) {
                if(!gercekFikstur[h]) continue;
                gercekFikstur[h].forEach(m => {
                    if(m.evSkor === "" || m.depSkor === "") return;
                    let es=Number(m.evSkor), ds=Number(m.depSkor);
                    pd[m.ev].o++; pd[m.dep].o++;
                    pd[m.ev].a += es; pd[m.ev].y += ds;
                    pd[m.dep].a += ds; pd[m.dep].y += es;
                    if(es > ds) { pd[m.ev].g++; pd[m.ev].p+=3; pd[m.dep].m++; }
                    else if(es < ds) { pd[m.dep].g++; pd[m.dep].p+=3; pd[m.ev].m++; }
                    else { pd[m.ev].b++; pd[m.ev].p+=1; pd[m.dep].b++; pd[m.dep].p+=1; }
                });
            }
            let tbody = document.getElementById("gercekPuanTablosuBody");
            tbody.innerHTML = "";
            let sirali = Object.keys(pd).sort((a,b) => (pd[b].p - pd[a].p) || ((pd[b].a-pd[b].y)-(pd[a].a-pd[a].y)));
            sirali.forEach((t, i) => {
                let s = pd[t], av = s.a-s.y;
                let tr = document.createElement("tr");
                if (i === 0) tr.className = "ucl-sampiyon";
                else if (i === 1) tr.className = "ucl-eleme";
                else if (i === 2) tr.className = "uel";
                else if (i === 3) tr.className = "ucl-konferans";
                else if (i >= sirali.length - 3) tr.className = "dusme-hatti";

                tr.innerHTML = `
                    <td><b>${i+1}.</b></td>
                    <td>
                        <div class="team-cell">
                            <img src="${logoGetir(t)}" class="team-logo" alt="">
                            <b>${t}</b>
                        </div>
                    </td>
                    <td>${s.o}</td><td>${s.g}</td><td>${s.b}</td><td>${s.m}</td><td>${s.a}</td><td>${s.y}</td><td>${av}</td><td><b>${s.p}</b></td>`;
                tbody.appendChild(tr);
            });
        }

        function yarismaPuanlariniHesapla() {
            let stats = [];
            for(let p=0; p<6; p++) {
                let pts=0, tam=0, fark=0;
                for(let h=1; h<=34; h++) {
                    if(!gercekFikstur[h] || !oyuncuTahminleri[p][h]) continue;
                    gercekFikstur[h].forEach((gm, i) => {
                        let tm = oyuncuTahminleri[p][h][i];
                        if(gm.evSkor==="" || tm.evSkor==="") return;
                        let ge=Number(gm.evSkor), gd=Number(gm.depSkor), te=Number(tm.evSkor), td=Number(tm.depSkor);
                        if(ge==te && gd==td) { pts+=10; tam++; }
                        else if((ge-gd == te-td) && ((ge>gd && te>td) || (ge<gd && te<td) || (ge==gd && te==td))) { pts+=7; fark++; }
                        else if((ge>gd && te>td) || (ge<gd && te<td) || (ge==gd && te==td)) { pts+=5; fark++; }
                    });
                }
                stats.push({name: oyuncuIsimleri[p], tam, fark, pts});
            }
            stats.sort((a,b) => b.pts - a.pts);
            let yBody = document.getElementById("yarismaTablosuBody");
            yBody.innerHTML = "";
            stats.forEach((o, i) => yBody.innerHTML += `<tr><td><b>${i+1}.</b></td><td><b>${o.name}</b></td><td>${o.tam}</td><td>${o.fark}</td><td><b>${o.pts}</b></td></tr>`);
        }

        arayuzuBaslat();
    </script>
</body>
