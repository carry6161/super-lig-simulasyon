<!DOCTYPE html>

        h1 { text-align: center; color: #1e293b; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 20px; font-size: 15px; }
        
        .main-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 480px; }
        h2 { border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; color: #334155; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        
        .controls-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; justify-content: space-between; }
        select { padding: 6px; font-size: 13px; border-radius: 4px; border: 1px solid #cbd5e1; background: #fff; }
        
        .match-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 6px 8px; background: #f8fafc; border-radius: 6px; font-size: 13px; }
        .team-box { display: flex; align-items: center; gap: 6px; width: 120px; }
        .team-box.left { justify-content: flex-end; text-align: right; }
        .team-box.right { justify-content: flex-start; text-align: left; }
        .team-logo { width: 22px; height: 22px; object-fit: contain; }

        /* Skor Input Stilleri (Gerçek Maçlar İçin) */
        .score-inputs { display: flex; align-items: center; gap: 4px; }
        .score-input { width: 28px; text-align: center; font-weight: bold; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; }

        /* 1-0-2 Buton Grubu Stilleri (Tahminler İçin) */
        .choices-group { display: flex; gap: 4px; }
        .choice-btn { background: #e2e8f0; border: none; padding: 5px 9px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; color: #334155; transition: 0.2s; }
        .choice-btn:hover { background: #cbd5e1; }
        .choice-btn.active-1 { background: #2563eb; color: white; }
        .choice-btn.active-0 { background: #d97706; color: white; }
        .choice-btn.active-2 { background: #dc2626; color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e2e8f0; padding: 5px; text-align: center; font-size: 12px; }
        th { background-color: #1e293b; color: white; }
        
        .team-cell { display: flex; align-items: center; justify-content: center; gap: 6px; }

        .ucl-sampiyon { background-color: #0f172a !important; color: white; font-weight: bold; }
        .ucl-eleme { background-color: #3b82f6 !important; color: white; }
        .uel { background-color: #f97316 !important; color: white; }
        .ucl-konferans { background-color: #10b981 !important; color: white; }
        .dusme-hatti { background-color: #ef4444 !important; color: white; }

        .btn { display: block; width: 100%; background-color: #2563eb; color: white; border: none; padding: 8px; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #1d4ed8; }
        .btn-green { background-color: #10b981; }
        .btn-green:hover { background-color: #059669; }
        
        #girisModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .modal-card { background: white; padding: 30px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }

        function arayuzuBaslat() {
            verileriYukle();
            
            let aktifIsim = oyuncuIsimleri[aktifKullaniciIndex];
            document.getElementById("kilitliProfilAdi").innerText = `Oturum: ${aktifIsim}`;
            document.getElementById("aktifProfilAdi").innerText = `${aktifIsim} Tahminleri`;

            let gSecici = document.getElementById("gercekHaftaSecici");
            let tSecici = document.getElementById("tahminHaftaSecici");
            gSecici.innerHTML = "";
            tSecici.innerHTML = "";
            for (let h = 1; h <= 34; h++) {
                gSecici.innerHTML += `<option value="${h}">${h}. Hafta</option>`;
                tSecici.innerHTML += `<option value="${h}">${h}. Hafta</option>`;
            }

            if (aktifKullaniciIndex !== 0) {
                document.getElementById("btnGercekGuncelle").style.display = "none";
            }

            gercekHaftaDegisti();
            tahminHaftaDegisti();
            gercekPuanlariHesapla();
            yarismaPuanlariniHesapla();
        }

        // Gerçek Maçlar: Skor Girişli (Sadece Admin değiştirebilir)
        function gercekHaftaDegisti() {
            let h = document.getElementById("gercekHaftaSecici").value;
            let alan = document.getElementById("gercekMaclarAlani");
            alan.innerHTML = "";
            if(!gercekFikstur[h]) return;
            
            let isAdmin = (aktifKullaniciIndex === 0);
            let disabl = isAdmin ? "" : "disabled";

            gercekFikstur[h].forEach((mac, index) => {
                alan.innerHTML += `
                    <div class="match-row">
                        <div class="team-box left">
                            <span>${mac.ev}</span>
                            <img src="${logoGetir(mac.ev)}" class="team-logo" alt="">
                        </div>
                        <div class="score-inputs">
                            <input ${disabl} type="number" min="0" class="score-input" id="g_ev_${h}_${index}" value="${mac.evSkor}" onchange="gercekSkorGuncelle(${h}, ${index})">
                            <span>-</span>
                            <input ${disabl} type="number" min="0" class="score-input" id="g_dep_${h}_${index}" value="${mac.depSkor}" onchange="gercekSkorGuncelle(${h}, ${index})">
                        </div>
                        <div class="team-box right">
                            <img src="${logoGetir(mac.dep)}" class="team-logo" alt="">
                            <span>${mac.dep}</span>
                        </div>
                    </div>`;
            });
        }

        function gercekSkorGuncelle(h, i) {
            if (aktifKullaniciIndex !== 0) return;
            let evVal = document.getElementById(`g_ev_${h}_${i}`).value;
            let depVal = document.getElementById(`g_dep_${h}_${i}`).value;
            gercekFikstur[h][i].evSkor = evVal;
            gercekFikstur[h][i].depSkor = depVal;
            verileriKaydet();
        }

        // Tahmin Paneli: 1-0-2 Butonlu
        function tahminHaftaDegisti() {
            let p = aktifKullaniciIndex;
            let h = document.getElementById("tahminHaftaSecici").value;
            let alan = document.getElementById("tahminMaclarAlani");
            alan.innerHTML = "";
            if(!oyuncuTahminleri[p][h]) return;

            oyuncuTahminleri[p][h].forEach((mac, i) => {
                alan.innerHTML += `
                    <div class="match-row">
                        <div class="team-box left">
                            <span>${mac.ev}</span>
                            <img src="${logoGetir(mac.ev)}" class="team-logo" alt="">
                        </div>
                        <div class="choices-group">
                            <button class="choice-btn ${mac.sonuc === '1' ? 'active-1' : ''}" onclick="tahminSonucSec(${p}, ${h}, ${i}, '1')">1</button>
                            <button class="choice-btn ${mac.sonuc === '0' ? 'active-0' : ''}" onclick="tahminSonucSec(${p}, ${h}, ${i}, '0')">0</button>
                            <button class="choice-btn ${mac.sonuc === '2' ? 'active-2' : ''}" onclick="tahminSonucSec(${p}, ${h}, ${i}, '2')">2</button>
                        </div>
                        <div class="team-box right">
                            <img src="${logoGetir(mac.dep)}" class="team-logo" alt="">
                            <span>${mac.dep}</span>
                        </div>
                    </div>`;
            });
        }

        function tahminSonucSec(p, h, i, val) {
            oyuncuTahminleri[p][h][i].sonuc = (oyuncuTahminleri[p][h][i].sonuc === val) ? "" : val;
            verileriKaydet();
            tahminHaftaDegisti();
        }

        function tahminleriKaydetMesaji() { 
            verileriKaydet(); 
            alert("Tahminleriniz başarıyla kaydedildi!"); 
        }

        // Gerçek Maç Skorlarına Göre Averajlı Puan Durumu Hesaplama
        function gercekPuanlariHesapla() {
            let pd = {};
            takimListesi.forEach(t => pd[t] = {o:0, g:0, b:0, m:0, a:0, y:0, p:0});
            for(let h=1; h<=34; h++) {
                if(!gercekFikstur[h]) continue;
                gercekFikstur[h].forEach(m => {
                    if(m.evSkor === "" || m.depSkor === "") return;
                    let eS = Number(m.evSkor);
                    let dS = Number(m.depSkor);
                    pd[m.ev].o++; pd[m.dep].o++;
                    pd[m.ev].a += eS; pd[m.ev].y += dS;
                    pd[m.dep].a += dS; pd[m.dep].y += eS;

                    if(eS > dS) {
                        pd[m.ev].g++; pd[m.ev].p += 3;
                        pd[m.dep].m++;
                    } else if(eS < dS) {
                        pd[m.dep].g++; pd[m.dep].p += 3;
                        pd[m.ev].m++;
                    } else {
                        pd[m.ev].b++; pd[m.ev].p += 1;
                        pd[m.dep].b++; pd[m.dep].p += 1;
                    }
                });
            }
            let tbody = document.getElementById("gercekPuanTablosuBody");
            tbody.innerHTML = "";
            let sirali = Object.keys(pd).sort((a,b) => (pd[b].p - pd[a].p) || ((pd[b].a - pd[b].y) - (pd[a].a - pd[a].y)) || (pd[b].a - pd[a].a));
            sirali.forEach((t, i) => {
                let s = pd[t], av = s.a - s.y;
                let tr = document.createElement("tr");
                if (i === 0) tr.className = "ucl-sampiyon";
                else if (i === 1) tr.className = "ucl-eleme";
                else if (i === 2) tr.className = "uel";
                else if (i === 3) tr.className = "ucl-konferans";
                else if (i >= sirali.length - 3) tr.className = "dusme-hatti";

                tr.innerHTML = `
                    <td><b>${i+1}.</b></td>
                    <td><div class="team-cell"><img src="${logoGetir(t)}" class="team-logo" alt=""><b>${t}</b></div></td>
                    <td>${s.o}</td><td>${s.g}</td><td>${s.b}</td><td>${s.m}</td><td>${s.a}</td><td>${s.y}</td><td>${av}</td><td><b>${s.p}</b></td>`;
                tbody.appendChild(tr);
            });
        }

        // Yarışma Puanı Hesaplama (Gerçek Maç Skorlarından 1-0-2 Çıkarılıp Tahminlerle Karşılaştırılır)
        function yarismaPuanlariniHesapla() {
            let stats = [];
            for(let p=0; p<6; p++) {
                let pts=0, dogruTahmin=0;
                for(let h=1; h<=34; h++) {
                    if(!gercekFikstur[h] || !oyuncuTahminleri[p][h]) continue;
                    gercekFikstur[h].forEach((gm, i) => {
                        let tm = oyuncuTahminleri[p][h][i];
                        if(gm.evSkor === "" || gm.depSkor === "" || !tm.sonuc) return;
                        
                        let eS = Number(gm.evSkor);
                        let dS = Number(gm.depSkor);
                        let gercekSonuc = eS > dS ? "1" : (eS < dS ? "2" : "0");

                        if(gercekSonuc === tm.sonuc) {
                            pts += 3;
                            dogruTahmin++;
                        }
                    });
                }
                stats.push({name: oyuncuIsimleri[p], dogruTahmin, pts});
            }
            stats.sort((a,b) => b.pts - a.pts);
            let yBody = document.getElementById("yarismaTablosuBody");
            yBody.innerHTML = "";
            stats.forEach((o, i) => yBody.innerHTML += `<tr><td><b>${i+1}.</b></td><td><b>${o.name}</b></td><td>${o.dogruTahmin}</td><td><b>${o.pts}</b></td></tr>`);
        }

        window.onload = function() {
            verileriYukle();
        };
    </script>
